      buildPhase: resources
    dependencies:
    - package: KSPlayer
      product: KSPlayer
    - package: AetherPlaybackKit
      product: AetherPlaybackBridge
      embed: true
    settings:
      base:
        PRODUCT_NAME: SignalVisionPro
        GENERATE_INFOPLIST_FILE: 'NO'
        INFOPLIST_FILE: PortedSource/VisionInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        SWIFT_COMPILATION_MODE: singlefile
