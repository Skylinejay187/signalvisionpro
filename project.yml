name: SignalVisionPro
options:
  bundleIdPrefix: com.channelsdebrid
  deploymentTarget:
    visionOS: '2.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 0.9.0-RESET10
    CURRENT_PROJECT_VERSION: '55'
    PRODUCT_BUNDLE_IDENTIFIER: com.channelsdebrid.visionpro
    GENERATE_INFOPLIST_FILE: 'NO'
    INFOPLIST_FILE: PortedSource/VisionInfo.plist
    INFOPLIST_KEY_CFBundleDisplayName: Signal
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Signal accesses media and backend services on your local network.
    TARGETED_DEVICE_FAMILY: '7'
    CODE_SIGNING_ALLOWED: 'NO'
    # Both Vision Pro and pinned Aether/FFmpeg simulator binaries are arm64.
    # Configure architectures in XcodeGen itself: an older GitHub workflow must not
    # silently request an incompatible x86_64 slice again.
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
packages:
  KSPlayer:
    path: Vendor/KSPNUVIO
  AetherPlaybackKit:
    path: Vendor/AetherPlaybackKit
schemes:
  SignalVisionPro:
    build:
      targets:
        SignalVisionPro: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  SignalVisionPro:
    type: application
    platform: visionOS
    deploymentTarget: '2.0'
    # Single Info.plist authority: explicit INFOPLIST_FILE in target settings.
    # Do not add XcodeGen target.info here: it can generate/overwrite a second plist.
    sources:
    - path: PortedSource/ReleaseCandidateSecurityManager.swift
    - path: PortedSource/StableFeatureGateManager.swift
    - path: PortedSource/Phase13RolloutManager.swift
    - path: PortedSource/CastExplorerService.swift
    - path: PortedSource/Phase15FinalIntegration.swift
    - path: PortedSource/BackendProfileBackupClient.swift
    - path: PortedSource/AuxiliaryVideoPlaybackCoordinator.swift
    - path: PortedSource/MediaFlowProxyRouter.swift
    - path: PortedSource/BackupStreamingClient.swift
    - path: PortedSource/NuvioPluginClient.swift
    - path: PortedSource/TorBoxUsenetClient.swift
    - path: PortedSource/DebridCredentialBridge.swift
    - path: PortedSource/ManagedAddonBridge.swift
    - path: PortedSource/ConnectedServicesHealthClient.swift
    - path: PortedSource/FocusedCardPreviewDiskCache.swift
    - path: PortedSource/CatalogHeroMetadataCache.swift
    - path: PortedSource/AutomaticSourceFailoverManager.swift
    - path: PortedSource/CatalogStore.swift
    - path: PortedSource/UnityAppCore.swift
    - path: PortedSource/UnitySurfaceSystem.swift
    - path: PortedSource/UnityFrameRuntime.swift
    - path: PortedSource/UnityAnimationCoordinator.swift
    - path: PortedSource/UnitySurfaceLifecycleCoordinator.swift
    - path: PortedSource/UnityCatalogVisualSystem.swift
