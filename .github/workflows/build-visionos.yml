name: Signal Vision Pro - Universal Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-visionos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate or unpack Vision Pro source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, zipfile, sys
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          def valid(base):
              return (base/'project.yml').is_file() and (base/'Sources').is_dir() and (base/'SharedFromAppleTV').is_dir()
          def locate(base):
              choices = [p.parent for p in base.rglob('project.yml') if 'AppleTVSource_vBRDC357' not in p.parts and '.git' not in p.parts and valid(p.parent)]
              return sorted(set(choices), key=str)
          options = locate(root)
          if not options:
              archives = sorted(root.glob('Signal-VisionPro_Build2*.zip'))
              if len(archives) != 1:
                  sys.exit('ERROR: Expected exactly one Build 2 source ZIP or extracted source. Upload the Build 2 ZIP or its contents (not just this workflow).')
              target = root/'_visionos_source'
              target.mkdir(exist_ok=True)
              with zipfile.ZipFile(archives[0]) as z:
                  for info in z.infolist():
                      resolved = (target/info.filename).resolve()
                      if not resolved.is_relative_to(target.resolve()):
                          sys.exit('ERROR: Unsafe path in ZIP.')
                  z.extractall(target)
              options = locate(target)
          if len(options) != 1:
              sys.exit(f'ERROR: Expected one visionOS project; found {len(options)}: {options}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROJECT_DIR={options[0]}\n')
          print(f'Using visionOS project: {options[0]}')
          PYTHON

      - name: Select available Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q xrsimulator; then
            xcodebuild -downloadPlatform visionOS
          fi
          xcodebuild -showsdks | grep -i vision

      - name: Install XcodeGen
        shell: bash
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate visionOS project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml
          test -d SignalVisionPro.xcodeproj

      - name: Build visionOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project SignalVisionPro.xcodeproj \
            -scheme SignalVisionPro \
            -configuration Release \
            -sdk xrsimulator \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SignalVisionProDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/visionos-build.log"

      - name: Package simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SignalVisionProDerivedData/Build/Products/Release-xrsimulator/SignalVisionPro.app"
          test -d "$APP"
          mkdir -p "$GITHUB_WORKSPACE/output"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/output/SignalVisionPro-Simulator.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignalVisionPro-build-log
          path: ${{ runner.temp }}/visionos-build.log
          if-no-files-found: ignore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SignalVisionPro-simulator
          path: output/SignalVisionPro-Simulator.zip
          
