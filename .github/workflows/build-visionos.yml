name: Signal Vision Pro - Universal Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-visionos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find actual project folder
        shell: bash
        run: |
          set -euo pipefail
          echo 'Repository root:'
          ls -la
          echo 'Project specifications found:'
          find . -maxdepth 6 -name project.yml -not -path '*/AppleTVSource_vBRDC357/*' -not -path '*/.git/*' -print
          if [[ -f project.yml ]]; then
            spec='./project.yml'
          else
            mapfile -t specs < <(find . -maxdepth 6 -name project.yml -not -path '*/AppleTVSource_vBRDC357/*' -not -path '*/.git/*' | sort)
            if (( ${#specs[@]} != 1 )); then
              echo 'ERROR: Expected one visionOS project.yml. Upload the CONTENTS of Build 2 ZIP (including project.yml, Sources, SharedFromAppleTV, Resources) to this repo; do not upload only the workflow.' >&2
              exit 1
            fi
            spec="${specs[0]}"
          fi
          project_dir="$(cd "$(dirname "$spec")" && pwd)"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using visionOS project: $project_dir"
          test -d "$project_dir/Sources"
          test -d "$project_dir/SharedFromAppleTV"

      - name: Select available Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_16.4.app ]]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q xrsimulator; then
            xcodebuild -downloadPlatform visionOS
          fi
          xcodebuild -showsdks | grep -i vision

      - name: Install XcodeGen
        shell: bash
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate visionOS project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml
          test -d SignalVisionPro.xcodeproj

      - name: Build visionOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project SignalVisionPro.xcodeproj \
            -scheme SignalVisionPro \
            -configuration Release \
            -sdk xrsimulator \
            -destination 'generic/platform=visionOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SignalVisionProDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/visionos-build.log"

      - name: Package simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/SignalVisionProDerivedData/Build/Products/Release-xrsimulator/SignalVisionPro.app"
          test -d "$APP"
          mkdir -p "$GITHUB_WORKSPACE/output"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/output/SignalVisionPro-Simulator.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignalVisionPro-build-log
          path: ${{ runner.temp }}/visionos-build.log
          if-no-files-found: ignore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SignalVisionPro-simulator
          path: output/SignalVisionPro-Simulator.zip
          
