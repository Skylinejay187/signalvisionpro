name: Signal Vision Pro Universal Builder

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-visionos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Locate newest Signal Vision Pro source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, zipfile, shutil
          from pathlib import Path

          root=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          work=root/"_signal_build_source"
          if work.exists(): shutil.rmtree(work)

          def score_name(name):
              s=name.lower()
              nums=[int(x) for x in re.findall(r'build[\s_-]?(\d+)',s)]
              build=max(nums or [0])
              suffix=0
              m=re.search(r'build[\s_-]?\d+([a-z])',s)
              if m: suffix=ord(m.group(1))-96
              return (build,suffix)

          def valid(p):
              return ((p/"project.yml").is_file() and
                      (p/"PortedSource").is_dir() and
                      (p/"Scripts").is_dir())

          # A checked-out source project is supported.
          roots=[p.parent for p in root.rglob("project.yml")
                 if ".git" not in p.parts and "_signal_build_source" not in p.parts and valid(p.parent)]
          roots=[p for p in roots if "OriginalTVOS" not in str(p)]

          if roots:
              roots.sort(key=lambda p:(score_name(p.name), p.stat().st_mtime), reverse=True)
              project=roots[0]
              print("Using checked-out source project:", project.relative_to(root))
          else:
              archives=[]
              for z in root.rglob("*.zip"):
                  if ".git" in z.parts: continue
                  try:
                      with zipfile.ZipFile(z) as f:
                          names=f.namelist()
                          if any(n.endswith("project.yml") for n in names):
                              archives.append(z)
                  except zipfile.BadZipFile:
                      pass
              if not archives:
                  sys.exit("ERROR: no Signal Vision Pro project or source ZIP found in repository.")
              archives.sort(key=lambda p:(score_name(p.name), p.stat().st_mtime), reverse=True)
              chosen=archives[0]
              print("Selected newest source ZIP:", chosen.relative_to(root))
              work.mkdir()
              with zipfile.ZipFile(chosen) as f:
                  for i in f.infolist():
                      target=(work/i.filename).resolve()
                      if not target.is_relative_to(work.resolve()):
                          sys.exit("ERROR: unsafe ZIP path")
                      if ((i.external_attr>>16)&0o170000)==0o120000:
                          sys.exit("ERROR: ZIP symlinks are not allowed")
                  f.extractall(work)
              candidates=[p.parent for p in work.rglob("project.yml") if valid(p.parent)]
              candidates=[p for p in candidates if "OriginalTVOS" not in str(p)]
              if not candidates:
                  sys.exit("ERROR: selected ZIP contains no usable Signal Vision Pro project.")
              candidates.sort(key=lambda p:(len(p.parts),score_name(p.name)))
              project=candidates[0]
              print("Extracted project root:", project.relative_to(work))

          print("project.yml:", project/"project.yml")
          print("PortedSource Swift files:", len(list((project/"PortedSource").rglob("*.swift"))))
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"PROJECT_DIR={project}\n")
          PY

      - name: Select Xcode and visionOS SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -q xros || xcodebuild -downloadPlatform visionOS
          xcodebuild -showsdks | grep -E 'xros|xrsimulator'

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Detect project capabilities
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          PLAYER=legacy
          if [ -f PortedSource/PlaybackKit/PlaybackKitAetherSurface.swift ] || grep -Rqs "AetherEngine" project.yml PortedSource 2>/dev/null; then
            PLAYER=aether
          fi
          echo "PLAYER_STACK=$PLAYER" >> "$GITHUB_ENV"
          echo "Detected player stack: $PLAYER"
          if [ -f PortedSource/PlaybackKit/PlaybackKitKSPlayerSurface.swift ] || [ -d Vendor/KSPNUVIO ]; then
            echo "Legacy KSPlayer files detected (allowed for historical source packages; current Aether-only packages should omit them)."
          fi

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PROJECT_DIR }}/Vendor
            ${{ env.PROJECT_DIR }}/.build-cache
          key: ${{ runner.os }}-signal-visionos-${{ hashFiles('**/project.yml', '**/Scripts/prepare_visionos_dependencies.sh') }}
          restore-keys: |
            ${{ runner.os }}-signal-visionos-

      - name: Prepare playback dependencies when supplied
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f Scripts/prepare_visionos_dependencies.sh ]; then
            bash Scripts/prepare_visionos_dependencies.sh 2>&1 | tee "$RUNNER_TEMP/vision-deps.log"
          else
            echo "No dependency preparation script in this source package." | tee "$RUNNER_TEMP/vision-deps.log"
          fi

      - name: Restore cinema asset cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/Resources/Cinema
          key: ${{ runner.os }}-signal-cinema-${{ hashFiles('**/Scripts/fetch_cinema_assets.py') }}

      - name: Prepare cinema assets when supported
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f Scripts/fetch_cinema_assets.py ]; then
            mkdir -p Resources/Cinema
            if [ ! -s Resources/Cinema/ASSET_SOURCES.txt ]; then
              python3 -m pip install --disable-pip-version-check --quiet trimesh numpy pillow
              python3 Scripts/fetch_cinema_assets.py --output Resources/Cinema
            else
              echo "Using cached cinema assets."
            fi
          fi

      - name: Validate source and generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f project.yml
          test -d PortedSource

          # Parse every Swift source cheaply before Xcode's expensive dependency build.
          mapfile -t SWIFT_FILES < <(find PortedSource -type f -name '*.swift' -print)
          if [ "${#SWIFT_FILES[@]}" -eq 0 ]; then
            echo "ERROR: PortedSource contains no Swift files"; exit 1
          fi
          xcrun swiftc -frontend -parse "${SWIFT_FILES[@]}"

          # Optional package-specific validation scripts.
          if [ -f Scripts/verify_cinema_plist.py ] && [ -f PortedSource/VisionInfo.plist ]; then
            python3 Scripts/verify_cinema_plist.py PortedSource/VisionInfo.plist
          fi

          xcodegen generate --spec project.yml

          PROJECT_FILE="$(find . -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then echo "ERROR: XcodeGen produced no .xcodeproj"; exit 1; fi
          PROJECT_FILE="${PROJECT_FILE#./}"

          SCHEME="$(xcodebuild -list -json -project "$PROJECT_FILE" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("project",{}).get("schemes",[]); print(s[0] if s else "")')"
          if [ -z "$SCHEME" ]; then echo "ERROR: no shared/buildable scheme detected"; exit 1; fi

          echo "XCODE_PROJECT=$PROJECT_FILE" >> "$GITHUB_ENV"
          echo "XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Generated project: $PROJECT_FILE"
          echo "Selected scheme: $SCHEME"

      - name: Build Vision Pro device app
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk xros \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath "$RUNNER_TEMP/SignalVisionDevice" \
            ARCHS=arm64 EXCLUDED_ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/vision-device.log"

      - name: Locate and validate compiled app
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/SignalVisionDevice/Build/Products" -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then echo "ERROR: compiled .app not found"; exit 1; fi
          test -f "$APP/Info.plist"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"
          echo "Compiled app: $APP"

          cd "$PROJECT_DIR"
          if [ -f Scripts/verify_cinema_plist.py ]; then
            python3 Scripts/verify_cinema_plist.py "$APP/Info.plist" | tee "$RUNNER_TEMP/vision-scene-manifest.log"
          fi

      - name: Package unsigned Vision Pro IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/output"
          APP_NAME="$(basename "$APP_PATH")"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/$APP_NAME"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/output/SignalVisionPro-UNSIGNED-DEVICE.ipa" Payload)

      - name: Upload Vision Pro IPA
        uses: actions/upload-artifact@v4
        with:
          name: SignalVisionPro-DEVICE-IPA
          path: output/SignalVisionPro-UNSIGNED-DEVICE.ipa
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignalVisionPro-build-diagnostics
          path: |
            ${{ runner.temp }}/vision-deps.log
            ${{ runner.temp }}/vision-device.log
            ${{ runner.temp }}/vision-scene-manifest.log
          if-no-files-found: ignore
          
